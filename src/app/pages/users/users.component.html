<div class="container">
  <h1>Users</h1>
  <div class="filter">
    <input type="text" placeholder="Search..." />
  </div>

  <table class="table table-hover" *ngIf="users().length > 0; else noUsers">
    <thead>
      <tr>
        <th class="col-1" scope="col">ID</th>
        <th class="col-3" scope="col">Name</th>
        <th class="col-5" scope="col">Role</th>
      </tr>
    </thead>
    <tbody>
      <tr class="table-row" *ngFor="let user of users()">
        <th scope="row">{{ user.id }}</th>
        <td>{{ user.username }}</td>
        <td class="align-middle">
          <div class="role-editor d-flex gap-md-2 flex-column justify-content-start flex-md-row align-content-stretch">
            <select class="form-select" [ngModel]="user.updatedRole.id" (ngModelChange)="onRoleChange(user, $event)">
              <option value="1">Admin</option>
              <option value="2">Interviewer</option>
              <option value="3">User</option>
            </select>
            <button type="button" class="btn btn-primary px-1 py-0" *ngIf="user.roleChanged" (click)="saveRole(user)">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                class="bi bi-cloud-arrow-up-fill" viewBox="0 0 16 16">
                <path
                  d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 5.146a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2a.5.5 0 0 1 .708 0z" />
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noUsers>
    <p>Нет пользователей для отображения</p>
  </ng-template>
</div>
